#   警告，不要再加。现有 release 产物即 full mode 产物，真机已验证。
#   full mode 的高危点已逐一排查：app 侧 Kotlin 无 native 方法、无 Parcelable，
#   enum 全部走编译期静态引用（values()/valueOf 均可被 R8 追踪）；按名字查找的
