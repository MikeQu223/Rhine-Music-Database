name: Platform build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      plugins_repository:
        required: false
        type: string
      plugins_ref:
        required: false
        type: string
      plugin_flavors:
        required: false
        type: string
  workflow_call:
    inputs:
      release_version:
        required: true
        type: string
      plugins_repository:
        required: false
        type: string
      plugins_ref:
        required: false
        type: string
      plugin_flavors:
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}-${{ inputs.release_version || 'development' }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    # Windows 需要从源码构建 LLVM 级的 dxc（cmake/Dxc.cmake 注释写明首次约需数十分钟），
    # 45 分钟不足以覆盖，故按平台区分。
    timeout-minutes: ${{ matrix.timeout || 45 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            qt-arch: clang_64
            node-platform: darwin-arm64
            artifact: macOS-arm64
            distribution: '*.zip'
          - name: Linux x86_64
            os: ubuntu-24.04
            qt-arch: linux_gcc_64
            node-platform: linux-x64
            artifact: Linux-x64
            distribution: '*.AppImage'
            # 自编 FFmpeg 现在带 LTO，五个库的链接期优化要额外几分钟；45 分钟掐在半路上
            # 比放宽上限更糟，因此单独给 Linux 留出余量。
            timeout: 60
            # LTO 是 Linux 产物的既定优化项（主程序 IPO + FFmpeg --enable-lto），
            # 工具链不支持时宁可失败也不要悄悄产出一个大 1.5 MB 的包。
            require-lto: '1'
          - name: Windows x64
            os: windows-2022
            qt-arch: win64_msvc2022_64
            # aqtinstall 3.3.0 仍查找旧目录，固定到支持 Qt 6.11+ Windows 仓库的上游版本。
            qt-installer: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7
            node-platform: win-x64
            artifact: Windows-x64
            distribution: 'Windows-x64-Setup.exe'
            timeout: 120
    runs-on: ${{ matrix.os }}
    env:
      NODE_VERSION: '26.11.1'
      RHINE_BUILD_TYPE: Release
      RHINE_VERSION: ${{ inputs.release_version || '' }}
      RHINE_REQUIRE_LTO: ${{ matrix.require-lto }}
    steps:
      - uses: actions/checkout@v4
        with:
          # FSR3 超分与插帧需要 FidelityFX SDK；着色器预编译需要 dxc 与 glslang。
          # 三者都以 submodule 记录，缺 SDK 时 cmake 会静默跳过 FSR 目标，
          # 因此必须显式递归检出，否则 CI 测不到 FSR 代码路径。
          submodules: false
      - name: Check out plugin packages
        if: inputs.plugins_repository != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.plugins_repository }}
          ref: ${{ inputs.plugins_ref || 'main' }}
          path: MusicBridge/local-plugins
      - name: Select Xcode with MetalFX frame interpolation
        if: runner.os == 'macOS'
        run: bash scripts/select-xcode.sh
      - name: Check out enabled graphics dependencies
        shell: bash
        run: git submodule update --init --recursive FidelityFX-SDK third_party/glslang
      - name: Check out pinned DXC source
        if: runner.os == 'Windows'
        shell: bash
        run: git submodule update --init --depth 1 -- third_party/dxc
      # ffmpeg.org 在 GitHub runner 上反复连接超时；Linux 直接从 GitHub 浅检出 gitlink
      # 锁定的源码。构建脚本仍校验提交与工作区，并记录源码来源，不依赖浮动分支或标签。
      - name: Check out pinned FFmpeg source
        if: runner.os == 'Linux'
        shell: bash
        run: git submodule update --init --depth 1 -- third_party/ffmpeg
      - name: Check out glslang vendored dependencies
        # 只有 Vulkan 分支会解析 glslang，但不在 macOS 上跳过：万一 runner 带了
        # MoltenVK 让 find_package(Vulkan) 成立，跳过就等于把 FSR3 静默关掉，
        # 而本步骤失败只是告警，多跑一次的代价远小于静默禁用。
        shell: bash
        run: |
          # glslang 16.x 用 known_good.json 而非 .gitmodules 固定依赖，因此
          # `submodules: recursive` 不会拉取它们。缺任一目录时 cmake/Glslang.cmake
          # 会回退到系统 glslangValidator，runner 上没有就退化为 FSR3 不可用。
          set -uo pipefail
          failed=0
          clone_pinned() {
            local subdir="$1" url="$2" commit="$3"
            local dest="third_party/glslang/$subdir"
            if [[ -f "$dest/CMakeLists.txt" ]]; then
              echo "already present: $subdir"
              return 0
            fi
            rm -rf "$dest"
            mkdir -p "$(dirname "$dest")"
            git init -q "$dest"
            git -C "$dest" remote add origin "$url"
            # 先按 commit 浅抓取；部分服务器不允许按 SHA 抓取，此时退回全量抓取。
            # 注意全量抓取后必须 checkout 该 commit，不能用 FETCH_HEAD：不带 ref 的
            # fetch 会让 FETCH_HEAD 指向默认分支最新提交，检出结果就偏离了 pin。
            if ! git -C "$dest" fetch -q --depth 1 origin "$commit"; then
              echo "shallow fetch by SHA failed, falling back to full fetch: $subdir"
              git -C "$dest" fetch -q origin
            fi
            git -C "$dest" checkout -q "$commit"
            test -f "$dest/CMakeLists.txt"
          }
          # 检出失败只影响「FSR3 Vulkan 走源码 glslang」这一条路径，不该让整个构建
          # 直接失败：macOS 上无用，Windows 走 DX12 也不需要它。汇总后作为警告输出。
          clone_pinned External/spirv-tools \
            https://github.com/KhronosGroup/SPIRV-Tools.git \
            ef96ed763b43b59b33b31b362f09a02b729fa1c9 || failed=1
          clone_pinned External/spirv-tools/external/spirv-headers \
            https://github.com/KhronosGroup/SPIRV-Headers.git \
            496543121ce6419f23d6fa5d7194ba66c36212d2 || failed=1
          if [[ "$failed" -ne 0 ]]; then
            echo "::warning::glslang 依赖检出失败，FSR3 Vulkan 将回退到系统 glslangValidator"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '26.11.1'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            MusicBridge/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      # Windows 与 Linux 的默认后端都是 Vulkan（README「图形后端」一节），
      # 而 Windows runner 镜像不预装 Vulkan SDK：缺 vulkan.h 时 Qt 的
      # QVulkanInstance / QRhiVulkanInitParams 不会声明，Vulkan 路径根本编不进来，
      # 默认后端就只能退成 D3D12。装 SDK 让这条路径真正可编译。
      - name: Install Vulkan SDK
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          # 只为编译期需要：头文件与 vulkan-1.lib。不装 SwiftShader / Lavapipe 软光栅，
          # 运行期是否有可用的物理设备由 vulkanDeviceAvailable() 探测决定，
          # 探测不到就回退 D3D12，不会因为缺 GPU 而让构建或测试失败。
          install_runtime: true
          cache: true
          stripdown: true
      - name: Resolve DXC cache key
        # 复用签名 = 子模块 rev + 构建配方，而配方里含编译器/ninja/Python 的绝对路径。
        # 因此 key 要同时带上 rev 和工具链标识：rev 换版本、镜像换工具链都会得到新 key，
        # 缓存自然失效并重新保存。若只按 rev 取 key，actions/cache 不会覆盖已存在的
        # key，镜像升级后就会永久命中旧缓存，而签名校验每次都判不等，退化成每次全量重建。
        if: runner.os == 'Windows'
        id: dxc
        shell: bash
        run: |
          set -euo pipefail
          cmake -S cmake/dxc-bootstrap -B output/dxc-bootstrap -G Ninja -DCMAKE_BUILD_TYPE=Release
          # install-qt-action runs setup-python again. Keep this interpreter even if
          # that action replaces pythonLocation and PATH before the application configure.
          host_python=$(sed -n 's/^RHINE_DXC_PYTHON_EXECUTABLE:FILEPATH=//p' output/dxc-bootstrap/CMakeCache.txt | tr -d '\r')
          test -n "$host_python"
          echo "RHINE_DXC_PYTHON_EXECUTABLE=$host_python" >> "$GITHUB_ENV"
          rev=$(git -C third_party/dxc rev-parse HEAD)
          signature=$(sha256sum output/dxc-bootstrap/rhine-dxc-signature.txt | cut -d' ' -f1)
          {
            cl 2>&1 | head -1 || true
            ninja --version 2>/dev/null || echo "ninja: 未找到"
            cmake --version | head -1
            python -c 'import sys; print(sys.executable)' 2>/dev/null || echo "python: 未找到"
          } > "$RUNNER_TEMP/dxc-tools.txt"
          echo "rev=${rev}" >> "$GITHUB_OUTPUT"
          echo "signature=${signature}" >> "$GITHUB_OUTPUT"
          echo "tools=$(sha256sum "$RUNNER_TEMP/dxc-tools.txt" | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore DXC build
        # generated/dxc 被 .gitignore 排除，干净检出后 RHINE_DXC_REUSE_BUILT 找不到
        # 产物，Windows 每次都要从源码编一遍 LLVM 级的 dxc（约数十分钟）。这里缓存
        # 的是本地从源码构建出来的产物，不是外来的预编译二进制；命中后签名校验通过，
        # ExternalProject 那一层整个跳过。
        #
        # runner 每次都是全新机器，但这份缓存存在 GitHub 侧的远端缓存里（仓库级，
        # 上限 10 GB），跨 runner、跨运行持久，与机器是否干净无关。它用的是 Actions
        # 运行时 token，不受上面 permissions: contents: read 影响；唯一存不进去的
        # 情况是来自 fork 的 pull_request——那种运行只能 restore。
        #
        # 拆成 restore/save 两步而不是单个 actions/cache：后者的保存在 post 步骤，
        # job 被 timeout 掐掉时不执行，会出现“编完了但没存上、下次再编一遍”的死循环。
        if: runner.os == 'Windows'
        id: dxc-cache
        uses: actions/cache/restore@v4
        with:
          path: generated/dxc
          key: dxc-win-${{ steps.dxc.outputs.rev }}-${{ steps.dxc.outputs.tools }}-${{ steps.dxc.outputs.signature }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libvulkan-dev 提供 vulkan.h：cmake/FidelityFX.cmake 用 find_package(Vulkan QUIET)
          # 探测后端，缺头文件会静默跳过 FSR3 的 Vulkan 实现。
          # gcc/g++/binutils 不是多余的：镜像默认预装，但 LTO 是硬需求（插件在 gcc 包里、
          # gcc-ar/gcc-ranlib 也来自它），写进依赖清单才不会因为镜像裁剪工具链而静默失效。
          sudo apt-get install --yes --no-install-recommends \
            cmake ninja-build file gcc g++ binutils libgl1-mesa-dev libxkbcommon-dev \
            libxkbcommon-x11-0 libxcb-cursor0 libvulkan-dev fontconfig fonts-noto-cjk
          # 裁剪的 MiSans 不含韩文字形，歌词通过 Qt 的系统字体回退绘制。
          # --no-install-recommends 不会自动带上 CJK 字体，需显式安装并刷新缓存。
          fc-cache -f
          # 构建脚本用 --appimage-extract-and-run 打包与冒烟测试，不依赖 FUSE；
          # 这里只为兼容手动验证，noble 已按 t64 改名，缺失不算失败。
          sudo apt-get install --yes --no-install-recommends libfuse2t64 || \
            sudo apt-get install --yes --no-install-recommends libfuse2 || true
          # DwarFS 镜像由 uruntime 通过 FUSE 挂载，手动跑产物时需要 fuse3。
          sudo apt-get install --yes --no-install-recommends fuse3 || \
            sudo apt-get install --yes --no-install-recommends libfuse3-3t64 || \
            sudo apt-get install --yes --no-install-recommends libfuse3-3 || true
      # LTO 的三个前提——编译器插件 liblto_plugin.so、带插件的归档器 gcc-ar/gcc-ranlib、
      # 以及能把插件交给 ld 的驱动——缺任一项时 CMake 的 check_ipo_supported 只会返回 NO，
      # 产物悄悄大 1.5 MB 而构建照样成功（FFmpeg 侧同样会静默丢掉 -flto）。这里在编译
      # 任何东西之前做一次端到端验证：先只产出纯 IR 的目标文件，再交给链接器，插件缺失会
      # 当场报 "plugin needed to handle lto object"。
      - name: Verify LTO toolchain
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cc --version | head -1
          ld --version | head -1
          plugin=$(cc -print-file-name=liblto_plugin.so)
          if [[ ! -f "$plugin" ]]; then
            echo "::error::GCC LTO 插件缺失：$plugin（apt 包 gcc）"
            exit 1
          fi
          for tool in gcc-ar gcc-ranlib gcc-nm; do
            if ! command -v "$tool" > /dev/null; then
              echo "::error::$tool 缺失，LTO 静态库无法归档（apt 包 gcc）"
              exit 1
            fi
          done
          probe="$RUNNER_TEMP/lto-probe"
          rm -rf "$probe"
          mkdir -p "$probe"
          cat > "$probe/value.c" <<'C'
          int lto_probe_value(int value) { return value + 1; }
          C
          cat > "$probe/main.c" <<'C'
          #include <stdio.h>
          int lto_probe_value(int value);
          int main(void) {
              printf("%d\n", lto_probe_value(41));
              return 0;
          }
          C
          # -fno-fat-lto-objects 让 value.o 只含 LTO IR；链接器若加载不到插件就会失败，
          # 这样这一步验证的是插件链路本身，而不是“能编出可执行文件”。
          cc -O2 -flto -fno-fat-lto-objects -c "$probe/value.c" -o "$probe/value.o"
          cc -O2 -c "$probe/main.c" -o "$probe/main.o"
          cc -O2 -flto "$probe/value.o" "$probe/main.o" -o "$probe/lto-probe"
          if [[ "$("$probe/lto-probe")" != "42" ]]; then
            echo "::error::LTO 产物运行结果异常"
            exit 1
          fi
          echo "LTO 可用：$plugin"
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          arch: ${{ matrix.qt-arch }}
          aqtsource: ${{ matrix.qt-installer }}
          # 锁定版本满足新 aqtinstall 的最低要求，避免 action 再降级到不兼容版本。
          py7zrversion: '==1.1.4'
          # Wayland 客户端插件 (libqwayland-*.so) 随 linux_gcc_64 基础包提供，
          # 由 aqt 的 --autodesktop 一并安装，不能写进 --modules。
          modules: qtshadertools qtmultimedia
          cache: true
      - name: Install build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check repository boundaries
        if: ${{ false }}
        run: node scripts/check-repository.cjs
      - name: Download standalone Node and verify checksum
        shell: bash
        env:
          NODE_PLATFORM: ${{ matrix.node-platform }}
        run: |
          set -euo pipefail
          distribution="node-v${NODE_VERSION}-${NODE_PLATFORM}"
          extension=tar.gz
          [[ "$RUNNER_OS" == Windows ]] && extension=zip
          archive="${distribution}.${extension}"
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 "https://nodejs.org/dist/v${NODE_VERSION}/${archive}" -o "$archive"
          curl --fail --location --retry 3 "https://nodejs.org/dist/v${NODE_VERSION}/SHASUMS256.txt" -o SHASUMS256.txt
          python - "$archive" <<'PY'
          import hashlib, pathlib, sys
          archive = pathlib.Path(sys.argv[1])
          checksums = dict(line.split()[::-1] for line in pathlib.Path('SHASUMS256.txt').read_text().splitlines())
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == checksums[archive.name], 'Node checksum mismatch'
          PY
          if [[ "$RUNNER_OS" == Windows ]]; then
            python -m zipfile -e "$archive" .
            echo "RHINE_NODE_BINARY=$(cygpath -w "$RUNNER_TEMP/$distribution/node.exe")" >> "$GITHUB_ENV"
            echo "RHINE_NODE_LICENSE=$(cygpath -w "$RUNNER_TEMP/$distribution/LICENSE")" >> "$GITHUB_ENV"
          else
            tar -xzf "$archive"
            echo "RHINE_NODE_BINARY=$RUNNER_TEMP/$distribution/bin/node" >> "$GITHUB_ENV"
            echo "RHINE_NODE_LICENSE=$RUNNER_TEMP/$distribution/LICENSE" >> "$GITHUB_ENV"
          fi
      # Linux 打包用的 mkdwarfs 与 uruntime 由构建脚本按锁定版本自动下载并校验 SHA256，
      # 无需预装；设置 RHINE_APPIMAGE_FS=squashfs 时改用 appimagetool，同样按锁定版本下载。
      - name: Build DXC toolchain
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cmake -S cmake/dxc-bootstrap -B output/dxc-bootstrap -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build output/dxc-bootstrap --target rhine_dxc
      - name: Check DXC build completeness
        # actions/cache 不会覆盖已存在的 key：一旦把半成品存进去，之后每次都会命中
        # 这份坏缓存、签名校验失败、重新全量构建，而保存又被 cache-hit 挡住，就永远
        # 修不好。dxc-source-revision.txt 由 ExternalProject 的 INSTALL 步骤最后写入，
        # 它和两个 DLL 同时存在才代表 dxc/dxcompiler/dxildll 三个目标都编完了。
        if: always() && runner.os == 'Windows'
        id: dxc-artifacts
        shell: bash
        run: |
          set -euo pipefail
          if [ -f generated/dxc/dxc-source-revision.txt ] \
             && [ -f generated/dxc/bin/dxc.exe ] \
             && [ -f generated/dxc/bin/dxcompiler.dll ] \
             && [ -f generated/dxc/bin/dxil.dll ] \
             && cmp -s generated/dxc/dxc-source-revision.txt output/dxc-bootstrap/rhine-dxc-signature.txt; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
            echo "DXC 产物不完整，跳过缓存保存"
          fi
      - name: Save DXC build
        # 紧跟构建之后显式保存，而不是等 actions/cache 的 post 步骤：这样即使后面的
        # 测试或打包失败，这份来之不易的 DXC 产物也已经落地，下次直接命中。
        #
        # continue-on-error：来自 fork 的 PR 只有缓存读权限，保存会 403；配额或网络
        # 出问题也一样。缓存只是加速手段，存不进去不该把构建判失败。
        if: always() && runner.os == 'Windows' && steps.dxc-cache.outputs.cache-hit != 'true' && steps.dxc-artifacts.outputs.complete == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: generated/dxc
          key: dxc-win-${{ steps.dxc.outputs.rev }}-${{ steps.dxc.outputs.tools }}-${{ steps.dxc.outputs.signature }}
      - name: Build and deploy
        run: npm run build
        env:
          QT_ROOT: ${{ env.QT_ROOT_DIR }}
      # 离线测试
      - name: Plugin contract checks (report-only)
        continue-on-error: true
        run: |
          npm run check:contract-freeze
          npm run check:core-boundary
          npm run check:plugin-contracts
          npm run check:provider-literals
      - name: Run offline regressions
        run: npm test
      - name: Build core-only flavor
        if: runner.os == 'macOS'
        run: |
          npm run build -- --plugins=core
          npm test
      - name: Build per-provider flavors
        if: runner.os == 'macOS' && inputs.plugins_repository != '' && inputs.plugin_flavors != ''
        shell: bash
        env:
          PLUGIN_FLAVORS: ${{ inputs.plugin_flavors }}
        run: |
          set -euo pipefail
          for flavor in ${PLUGIN_FLAVORS//,/ }; do
            echo "::group::Plugin flavor: $flavor"
            npm run build -- --plugins="$flavor"
            npm test
            echo "::endgroup::"
          done
      - name: Restore full artifact
        if: runner.os == 'macOS'
        run: npm run build
      - name: Verify core-only artifact
        run: |
          node scripts/package-core-only.cjs
          node scripts/check-packaged-core.cjs output/core-only/MusicBridge
      - name: Create distribution
        if: runner.os != 'Linux'
        run: npm run share
      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: RHINE-MUSIC-DATABASE-${{ matrix.artifact }}
          path: output/RhineMusicDatabase-${{ inputs.release_version || '*' }}-${{ matrix.distribution }}
          if-no-files-found: error

  ios:
    name: iOS arm64 (unsigned)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      RHINE_VERSION: ${{ inputs.release_version || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            MusicBridge/package-lock.json
      - name: Select Xcode with MetalFX frame interpolation
        run: bash scripts/select-xcode.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 跨平台工具（qsb 等）由同版本桌面 kit 提供，设备库使用独立 iOS kit。
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          arch: clang_64
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7
          py7zrversion: '==1.1.4'
          modules: qtshadertools qtmultimedia
          cache: true
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          target: ios
          arch: ios
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7
          py7zrversion: '==1.1.4'
          modules: qtshadertools qtmultimedia
          cache: true
      - name: Install build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Use setup-node runtime for resource preparation
        run: |
          node - <<'JS' >> "$GITHUB_ENV"
          const fs = require('node:fs');
          const path = require('node:path');
          const license = path.resolve(path.dirname(process.execPath), '../LICENSE');
          if (!fs.existsSync(license)) {
              throw new Error('Standalone Node license missing');
          }
          console.log('RHINE_NODE_BINARY=' + process.execPath);
          console.log('RHINE_NODE_LICENSE=' + license);
          JS
      - name: Build and audit unsigned IPA
        run: npm run build:ios
        env:
          RHINE_IOS_QT: ${{ env.QT_ROOT_DIR }}
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: RHINE-MUSIC-DATABASE-iOS-arm64
          path: output/RhineMusicDatabase-*-ios-unsigned.ipa
          if-no-files-found: error

  android:
    # Android 仍是独立 job：没有 needs，matrix 的 fail-fast 也不会波及它，
    # 因此它失败不会改变桌面/iOS 的构建与发布，反之亦然。
    name: Android arm64-v8a (APK)
    runs-on: ubuntu-24.04
    # 发布流程经 workflow_call 复用本工作流时只出桌面/iOS 包：Android APK 不在
    # scripts/release-version.cjs 的 distributionPlatforms 里，构建它只会白等两小时。
    if: ${{ !inputs.release_version }}
    # 冷启动要从 vendored 源码交叉编译 Qt for Android（qtbase/qtdeclarative/
    # qtmultimedia/qtsvg/qtshadertools + OpenSSL），4 核 runner 约 1.5–2 小时；
    # 命中 kit 缓存后出包只要几分钟。上限按最坏情况给，不做矩阵。
    timeout-minutes: 300
    env:
      RHINE_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Check out Qt sources for the Android kit
        shell: bash
        # Qt 6.12 没有公开的 Android 预编译包（在线仓库只到 6.6.3），kit 只能拿
        # 这五个子模块自己编；浅克隆命令与 .gitmodules 里记录的本地做法一致。
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 \
            third_party/qt/qtbase \
            third_party/qt/qtdeclarative \
            third_party/qt/qtmultimedia \
            third_party/qt/qtsvg \
            third_party/qt/qtshadertools
      - uses: actions/setup-node@v4
        with:
          node-version: '26.11.1'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            MusicBridge/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # AGP 只接受 JDK 17–21 的运行期；runner 默认的更高版本会被直接拒绝。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # 释放磁盘：Qt kit 的构建树 + kit 本身约 6–8 GB，而 runner 预装的 NDK 与
      # dotnet 等工具链占了好几 GB。NDK 随后按固定版本重装，删掉预装的不会影响。
      - name: Free disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"/ndk/* || true
          df -h /
      # 只让它把 cmdline-tools / 环境变量准备好：默认的 packages 列表是
      # "tools platform-tools"，而新版 SDK 仓库已经删掉 legacy 的 tools 包，
      # sdkmanager 会报 "Failed to find package 'tools'" 并以 1 退出。
      # 真正需要的 platform/build-tools/NDK 由下一步显式安装。
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android platform, build-tools and NDK
        shell: bash
        # 版本必须与 scripts/audit-android.py 的断言（platform android-36）和
        # android-toolchain.cjs 的探测方式（取 $SDK/ndk 下最大版本）对齐；
        # NDK 固定在 r30，与本地构建保持一致，避免工具链漂移带出新的告警。
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.16248370"
      - name: Install Qt for Android build dependencies
        run: |
          sudo apt-get update
          # cmake/ninja/g++/perl 是交叉编译 Qt 与 OpenSSL 的最低要求；
          # file 供 Qt 的 configure 探测产物类型。
          sudo apt-get install --yes --no-install-recommends \
            cmake ninja-build g++ perl file
      # 宿主 Qt 供交叉编译使用（moc/rcc/qmlcachegen 等）。Qt 6 的 Android 构建
      # 要求 $RHINE_HOST_QT/lib/cmake/Qt6HostInfo 存在，所以必须装一份 6.12.0
      # 桌面 kit，而不是依赖 runner 自带的旧 Qt。
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          arch: linux_gcc_64
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7
          modules: qtshadertools qtmultimedia
          cache: true
      - name: Install build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compute Qt kit cache key
        id: qt-kit-key
        shell: bash
        # 缓存签名必须覆盖一切会影响 kit 产物的输入：五个子模块的 pinned 提交、
        # 构建/补丁脚本内容、OpenSSL 锁定版本、NDK 与宿主 Qt 版本。
        # 漏掉任何一项都会永久命中过期 kit（actions/cache 不覆盖已存在的 key）。
        run: |
          set -euo pipefail
          {
            for module in qtbase qtdeclarative qtmultimedia qtsvg qtshadertools; do
              echo "$module $(git -C third_party/qt/$module rev-parse HEAD)"
            done
            sha256sum scripts/build-qt-android.cjs scripts/qt-android-patches.cjs \
              scripts/android-toolchain.cjs vendor/openssl/source.json
            echo "host-qt 6.12.0 linux_gcc_64"
            echo "ndk 30.0.16248370"
            echo "platform android-36 build-tools 36.0.0"
          } > "$RUNNER_TEMP/qt-kit-signature.txt"
          echo "signature=$(sha256sum "$RUNNER_TEMP/qt-kit-signature.txt" | cut -c1-24)" >> "$GITHUB_OUTPUT"
      - name: Restore Qt for Android kit
        id: qt-kit-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            output/dependencies/qt-android
            output/dependencies/openssl-android
          key: qt-android-kit-${{ steps.qt-kit-key.outputs.signature }}
      - name: Build Qt for Android kit
        # 构建期补丁（scripts/qt-android-patches.cjs）也在这里生效：子模块保持干净，
        # 补丁按内容锚点写入工作树；锚点失配会让构建直接失败而不是产出旧行为。
        if: steps.qt-kit-cache.outputs.cache-hit != 'true'
        env:
          RHINE_HOST_QT: ${{ env.QT_ROOT_DIR }}
        run: npm run build:qt:android
      - name: Save Qt for Android kit
        # 显式保存而不是依赖 actions/cache 的 post 步骤：job 被 timeout 掐掉时
        # 保存不会执行，会出现"编完了没存上、下次再编一遍"的死循环。
        # fork PR 只有缓存读权限，保存失败不该把构建判失败。
        if: steps.qt-kit-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            output/dependencies/qt-android
            output/dependencies/openssl-android
          key: qt-android-kit-${{ steps.qt-kit-key.outputs.signature }}
      - name: Build, sign and audit APK
        # 打包脚本内部会重建桥接 bundle（移动端 tmpdir 改写与断言在这里执行）、
        # 下载校验 libnode.so、签名并用 audit-android.py 检查权限白名单。
        # 编译优化档位（RHINE_ANDROID_LTO / R8 / legacy packaging / 烘焙变体）统一由
        # scripts/build-android.cjs 的默认值决定，这里不要单独设 env：本机与 CI 必须
        # 走同一份默认值，CI 单独覆盖会让两边编出不同的包。
        run: npm run build:android
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RHINE-MUSIC-DATABASE-Android-arm64
          # CI 不带本地发布密钥（*.key 不入库），产物默认无后缀；带 -signed 是为了
          # 将来若把发布密钥作为 secret 提供给 CI，这个名字也能被收进来。
          path: output/RhineMusicDatabase-*-android-arm64-v8a*.apk
          if-no-files-found: error
